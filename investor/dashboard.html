<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Investor Dashboard - KiroiX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    body { background-color: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="p-4">
  <div class="max-w-3xl mx-auto">
    <div id="warningBanner" class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-3 mb-4 hidden rounded">
      ⚠️ Lisensi Anda akan segera habis dalam 3 hari. Segera perpanjang.
    </div>
    <div class="bg-white rounded-xl shadow-md p-6">
      <h1 class="text-2xl font-bold text-blue-600 mb-4">Informasi Lisensi</h1>
      <div id="content" class="space-y-3">
        <p class="text-gray-500">Memuat data...</p>
      </div>
      <div class="mt-6 text-center">
        <a href="/" class="text-blue-600 text-sm">← Kembali ke Beranda</a>
      </div>
    </div>
  </div>

  <script>
    // Inisialisasi Firebase (tanpa auth, hanya baca)
    const firebaseConfig = {
      apiKey: "AIzaSyAs_1Y_8d5mKhhnmeeNPlsFn4eDsd18E7k",
      authDomain: "kiroi-x-ecosystem.firebaseapp.com",
      databaseURL: "https://kiroi-x-ecosystem-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kiroi-x-ecosystem",
      storageBucket: "kiroi-x-ecosystem.firebasestorage.app",
      messagingSenderId: "969313803710",
      appId: "1:969313803710:web:5e8b74e3f01e682967adef",
      measurementId: "G-GK269RNX4Y"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Ambil parameter account dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const accountNumber = urlParams.get('account');

    if (!accountNumber) {
      document.getElementById('content').innerHTML = '<p class="text-red-500">Parameter akun tidak ditemukan. Silakan kembali ke halaman utama.</p>';
    } else {
      const licenseRef = database.ref(`licenses/${accountNumber}`);
      licenseRef.on('value', (snap) => {
        const license = snap.val();
        if (!license) {
          document.getElementById('content').innerHTML = '<p class="text-red-500">Lisensi tidak ditemukan untuk akun ini.</p>';
          return;
        }

        const isActive = (license.status === 'ACTIVE' && Date.now() < license.expiry_date);
        const remainingDays = Math.max(0, Math.floor((license.expiry_date - Date.now()) / (1000 * 60 * 60 * 24)));
        
        const formatDate = (ts) => ts ? new Date(ts).toLocaleString('id-ID') : '-';
        const formatCurrency = (val) => val ? `$${val.toFixed(2)}` : '-';

        let html = `
          <p><strong>Nomor Akun:</strong> ${accountNumber}</p>
          <p><strong>License Key:</strong> <code class="bg-gray-100 px-2 py-1 rounded">${license.license_key || '-'}</code></p>
          <p><strong>Membership:</strong> ${license.membership_type || '-'}</p>
          <p><strong>Status:</strong> <span class="px-2 py-1 rounded-full text-xs ${isActive ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${license.status || '-'}</span></p>
          <p><strong>Expiry Date:</strong> ${formatDate(license.expiry_date)}</p>
          <p><strong>Sisa Hari:</strong> ${remainingDays} hari</p>
          <p><strong>Heartbeat Terakhir:</strong> ${formatDate(license.last_heartbeat)}</p>
          <p><strong>VPS Rental:</strong> ${license.vps_rental ? `Aktif (sisa $${license.vps_remaining})` : 'Tidak'}</p>
        `;
        document.getElementById('content').innerHTML = html;

        // Tampilkan warning jika sisa 3 hari atau kurang dan masih aktif
        if (isActive && remainingDays <= 3) {
          document.getElementById('warningBanner').classList.remove('hidden');
        } else {
          document.getElementById('warningBanner').classList.add('hidden');
        }
      }, (error) => {
        console.error(error);
        document.getElementById('content').innerHTML = '<p class="text-red-500">Gagal memuat data. Periksa koneksi atau coba lagi nanti.</p>';
      });
    }
  </script>
</body>
</html>
