<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiroiX | Investor Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased pb-20">

    <div class="max-w-6xl mx-auto px-4 pt-6">
        <header class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 mb-6 flex flex-wrap gap-4 items-end justify-between">
            <div class="flex flex-wrap gap-3 items-end">
                <div class="flex flex-col">
                    <span class="text-[10px] font-black text-blue-600 uppercase mb-1">Account Login</span>
                    <input type="text" id="accInput" value="1051057600" class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm font-bold w-40 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex flex-col">
                    <span class="text-[10px] font-black text-slate-400 uppercase mb-1">Select Period</span>
                    <div class="flex gap-1">
                        <select id="monthSel" class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm font-bold outline-none"></select>
                        <select id="yearSel" class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm font-bold outline-none"></select>
                    </div>
                </div>
                <button id="btnLoad" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg shadow-blue-100 transition-all active:scale-95 flex items-center gap-2 text-sm">
                    <span id="btnText">Update Dashboard</span>
                    <div id="btnLoader" class="hidden loader w-3 h-3 border-2 border-white rounded-full"></div>
                </button>
            </div>
            <div class="hidden sm:block text-right">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Last Sync</span>
                <p id="lastSync" class="text-sm font-black text-slate-600">-</p>
            </div>
        </header>

        <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="stat-card">
                <p class="stat-label">Initial Deposit</p>
                <p id="statDeposit" class="stat-value">$0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Current Equity</p>
                <p id="statEquity" class="stat-value">$0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Total Growth</p>
                <p id="statGrowth" class="stat-value text-emerald-500">0%</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Drawdown</p>
                <p id="statDD" class="stat-value text-red-500">0%</p>
            </div>
        </section>

        <main class="grid lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                <div class="flex items-center justify-between mb-6">
                    <h2 id="calTitle" class="text-lg font-black text-slate-800 uppercase tracking-tight">Daily Progress</h2>
                    <div class="flex gap-3 text-[9px] font-bold text-slate-400 uppercase">
                        <span class="flex items-center gap-1"><i class="w-2 h-2 rounded-full bg-emerald-500"></i> Profit</span>
                        <span class="flex items-center gap-1"><i class="w-2 h-2 rounded-full bg-red-400"></i> Loss</span>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-2 mb-2 text-center text-[10px] font-black text-slate-300 uppercase">
                    <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
                </div>
                <div id="calGrid" class="grid grid-cols-7 gap-2"></div>
            </div>

            <aside class="space-y-6">
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                    <h2 class="text-lg font-black text-slate-800 mb-4 uppercase tracking-tight">Equity Curve</h2>
                    <div class="h-52">
                        <canvas id="equityChart"></canvas>
                    </div>
                </div>
                <div class="bg-slate-900 p-6 rounded-[2rem] text-white shadow-xl">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Active Server</span>
                    <p id="brokerName" class="text-lg font-bold text-blue-400 mt-1">Disconnect</p>
                    <div class="mt-6 pt-6 border-t border-slate-800 flex justify-between items-center">
                        <p id="statStatus" class="text-xs font-bold text-emerald-400 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> ONLINE
                        </p>
                        <p class="text-[10px] font-bold text-slate-500 uppercase">KiroiX AI Engine</p>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
