<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiroiX Dashboard | Monitoring</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-100 text-slate-900 antialiased pb-10">

    <div class="max-w-6xl mx-auto px-4 pt-6">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-3 items-center">
                <input type="text" id="accInput" value="1051057600" placeholder="Account Number" class="border border-slate-300 p-2 rounded-lg w-40 text-sm font-bold">
                <select id="monthSel" class="border border-slate-300 p-2 rounded-lg text-sm font-bold"></select>
                <select id="yearSel" class="border border-slate-300 p-2 rounded-lg text-sm font-bold"></select>
                <button id="btnLoad" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-lg transition-all flex items-center gap-2">
                    <span id="btnText">Tampilkan Data</span>
                    <div id="btnLoader" class="hidden loader w-3 h-3 border-2 border-white rounded-full"></div>
                </button>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-slate-400 font-bold">Last Sync WITA</p>
                <p id="lastSync" class="font-bold text-slate-600">-</p>
            </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-bold text-slate-400 uppercase">Initial Deposit</p>
                <p id="statDeposit" class="text-xl font-bold text-slate-800">$0</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-bold text-slate-400 uppercase">Latest Equity</p>
                <p id="statEquity" class="text-xl font-bold text-slate-800">$0</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-bold text-slate-400 uppercase">Total Growth</p>
                <p id="statGrowth" class="text-xl font-bold text-emerald-500">0%</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-bold text-slate-400 uppercase">Max Drawdown</p>
                <p id="statDD" class="text-xl font-bold text-red-500">0%</p>
            </div>
        </div>

        <div class="grid lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h2 id="calTitle" class="text-lg font-bold text-slate-800 mb-4">Performance</h2>
                <div class="grid grid-cols-7 gap-2 mb-2 text-center text-[10px] font-bold text-slate-400 uppercase">
                    <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
                </div>
                <div id="calGrid" class="grid grid-cols-7 gap-2"></div>
            </div>

            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="text-md font-bold text-slate-800 mb-4">Equity Curve</h2>
                    <canvas id="equityChart"></canvas>
                </div>
                <div class="bg-slate-800 p-5 rounded-xl text-white">
                    <p class="text-xs font-bold text-slate-400 uppercase">Broker Server</p>
                    <p id="brokerName" class="text-md font-bold text-blue-300 mt-1">Waiting...</p>
                    <div class="mt-4 pt-4 border-t border-slate-700 flex justify-between items-center text-xs">
                        <span id="statStatus" class="text-emerald-400 font-bold">● ONLINE</span>
                        <span class="text-slate-500">KiroiX AI Trade</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
