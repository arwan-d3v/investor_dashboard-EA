<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Dashboard | KiroiX AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
        <div class="w-full max-w-md p-8 text-center">
            <div class="mb-6">
                <h1 class="text-3xl font-black text-slate-800 tracking-tighter">KiroiX <span class="text-blue-600">INVESTOR</span></h1>
                <p class="text-slate-400 text-sm font-bold uppercase tracking-widest mt-2">Account Monitoring System</p>
            </div>
            <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100 shadow-xl shadow-blue-50/50">
                <p class="text-xs font-bold text-slate-400 mb-4 uppercase">Masukkan Nomor Akun MT5 Anda</p>
                <input type="text" id="accInput" placeholder="Contoh: 1051057600" 
                    class="w-full bg-white border border-slate-200 p-4 rounded-2xl text-center text-xl font-black outline-none focus:ring-4 focus:ring-blue-100 transition-all mb-4">
                <button id="btnLoad" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-3">
                    <span id="btnText">Masuk ke Dashboard</span>
                    <div id="btnLoader" class="hidden loader w-4 h-4 border-2 border-white rounded-full"></div>
                </button>
            </div>
            <p class="mt-8 text-[10px] font-bold text-slate-300 uppercase tracking-widest">© 2026 KiroiX AI Ecosystem</p>
        </div>
    </div>

    <div id="dashboardView" class="hidden opacity-0 transition-opacity duration-700 max-w-6xl mx-auto px-4 pt-6 pb-20">
        <header class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="location.reload()" class="p-2 hover:bg-slate-100 rounded-xl transition-all">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                </button>
                <div>
                    <h2 class="text-sm font-black text-slate-800" id="displayAcc">-</h2>
                    <p class="text-[9px] font-bold text-slate-400 uppercase">Investor Read-Only</p>
                </div>
            </div>
            <div class="flex gap-2">
                <select id="monthSel" class="bg-slate-50 border border-slate-100 p-2 rounded-xl text-xs font-bold outline-none"></select>
                <select id="yearSel" class="bg-slate-50 border border-slate-100 p-2 rounded-xl text-xs font-bold outline-none"></select>
            </div>
        </header>

        <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="stat-card">
                <p class="stat-label">Initial Deposit</p>
                <p id="statDeposit" class="stat-value">$0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Current Equity</p>
                <p id="statEquity" class="stat-value">$0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Growth</p>
                <p id="statGrowth" class="stat-value text-emerald-500">0%</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Max Drawdown</p>
                <p id="statDD" class="stat-value text-red-500">0%</p>
            </div>
        </section>

        <main class="grid lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                <h2 class="text-lg font-black text-slate-800 mb-4 uppercase tracking-tight">Performance Calendar</h2>
                <div id="calGrid" class="grid grid-cols-7 gap-2"></div>
            </div>
            <aside class="space-y-6">
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                    <h2 class="text-md font-black text-slate-800 mb-4 uppercase tracking-tight">Equity Curve</h2>
                    <canvas id="equityChart"></canvas>
                </div>
                <div class="bg-slate-900 p-6 rounded-[2rem] text-white shadow-xl">
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Active Server</p>
                    <p id="brokerName" class="text-lg font-bold text-blue-400 mt-1">Disconnect</p>
                    <div class="mt-4 pt-4 border-t border-slate-800 flex justify-between items-center">
                        <span class="text-xs font-bold text-emerald-400 flex items-center gap-2">● ONLINE</span>
                        <span id="lastSync" class="text-[9px] font-bold text-slate-500">-</span>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
