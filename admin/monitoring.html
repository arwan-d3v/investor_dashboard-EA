<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Monitoring Akun - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>body{background:#F8FAFC}</style>

<body class="p-4">
  <div class="max-w-6xl mx-auto">

      <a href="index.html" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition text-sm">← Kembali</a>
    </div>
    
    <div class="bg-white rounded-xl shadow-md p-4 mb-6">
      <div class="flex flex-col sm:flex-row gap-2">
        <input type="text" id="accountSearch" placeholder="Nomor Akun" class="border rounded p-2 flex-1">
        <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded transition">Cari</button>
      </div>
    </div>
    
    <div id="accountDetails" class="bg-white rounded-xl shadow p-4"></div>
  </div>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/monitoring.js"></script>
  <script>
    requireAdmin().then(() => {
      loadMonitoring();
    });
  </script>

</html>
