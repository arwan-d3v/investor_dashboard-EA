<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA Control Panel - KiroiX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-50 p-4">
<div class="max-w-6xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-blue-600">EA Control Panel</h1>
    <a href="index.html" class="bg-gray-500 text-white px-4 py-2 rounded-lg">← Admin</a>
  </div>
  <div class="bg-white rounded-xl shadow-md p-6 mb-6">
    <div class="mb-4">
      <label class="block font-medium">Nomor Akun</label>
      <input type="text" id="accountNumber" class="border rounded p-2 w-full" placeholder="183969086">
    </div>
    <button id="loadBtn" class="bg-blue-600 text-white px-4 py-2 rounded">Load Kontrol</button>
  </div>

  <div id="controlPanel" class="bg-white rounded-xl shadow-md p-6 hidden">
    <h2 class="text-xl font-semibold mb-4">Pengaturan EA untuk Akun <span id="displayAccount"></span></h2>
    
    <div class="grid md:grid-cols-2 gap-6">
      <!-- Kolom kiri -->
      <div>
        <div class="mb-4">
          <label class="inline-flex items-center">
            <input type="checkbox" id="enabled" class="mr-2"> <span class="font-medium">Enable EA (Start/Stop Global)</span>
          </label>
        </div>
        <div class="mb-4">
          <label class="block font-medium">Mode Operasi</label>
          <select id="mode" class="border rounded p-2 w-full">
            <option value="auto">Auto (Gunakan Time Filter Internal EA)</option>
            <option value="hybrid">Hybrid (Jadwal Per Hari)</option>
            <option value="manual">Manual (24 Jam, tanpa filter)</option>
          </select>
        </div>
        <div class="border-t pt-4 mb-4">
          <div class="font-medium mb-2">Force Control (Override Semua Filter)</div>
          <div class="flex gap-3">
            <button id="forceStartBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Force Start EA</button>
            <button id="forceStopBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">Force Stop EA</button>
            <button id="resetForceBtn" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded">Reset Force</button>
          </div>
          <p class="text-xs text-gray-500 mt-2">Force Start akan memaksa EA trading (abaikan jadwal). Force Stop akan menghentikan EA. Reset menghapus kedua force.</p>
        </div>
      </div>

      <!-- Kolom kanan: Jadwal Hybrid -->
      <div id="hybridPanel" class="border-l pl-6 hidden">
        <h3 class="font-bold text-lg mb-3">Jadwal Trading (Mode Hybrid)</h3>
        <div id="dailySchedules" class="space-y-4"></div>
      </div>
    </div>

    <div class="mt-6">
      <button id="saveBtn" class="bg-green-600 text-white px-6 py-2 rounded w-full">Simpan Pengaturan</button>
      <div id="statusMsg" class="text-sm text-center mt-2"></div>
    </div>
  </div>
</div>

<script src="../assets/js/firebase-config.js"></script>
<script>
requireAdmin().then(() => {
  const db = firebase.database();
  let currentAccount = '';

  const days = ['monday','tuesday','wednesday','thursday','friday'];
  const dayNames = ['Senin','Selasa','Rabu','Kamis','Jumat'];

  async function loadControls() {
    const acc = document.getElementById('accountNumber').value.trim();
    if(!acc) { alert('Masukkan nomor akun'); return; }
    currentAccount = acc;
    document.getElementById('displayAccount').innerText = currentAccount;
    const ref = db.ref(`ea_controls/${currentAccount}`);
    const snap = await ref.once('value');
    const data = snap.val() || {};
    
    document.getElementById('enabled').checked = data.enabled === true;
    document.getElementById('mode').value = data.mode || 'auto';
    
    // Force state (tampilkan indikator, tidak perlu input checkbox, cukup tombol)
    // Kita simpan di hidden atau variable
    window.forceStartState = data.force_start === true;
    window.forceStopState = data.force_stop === true;
    updateForceButtonsUI();
    
    // Schedule hybrid
    const schedule = data.schedule || {};
    const container = document.getElementById('dailySchedules');
    container.innerHTML = '';
    for(let i=0; i<days.length; i++) {
      const day = days[i];
      const dayData = schedule[day] || {};
      const enabled = dayData.enabled === true;
      const startHour = dayData.start_hour !== undefined ? dayData.start_hour : 7;
      const startMin = dayData.start_minute !== undefined ? dayData.start_minute : 5;
      const stopHour = dayData.stop_hour !== undefined ? dayData.stop_hour : 23;
      const stopMin = dayData.stop_minute !== undefined ? dayData.stop_minute : 45;
      
      const div = document.createElement('div');
      div.className = 'border rounded p-3 bg-gray-50';
      div.innerHTML = `
        <label class="flex items-center gap-2 font-medium">
          <input type="checkbox" class="day-enabled" data-day="${day}" ${enabled ? 'checked' : ''}> ${dayNames[i]}
        </label>
        <div class="grid grid-cols-2 gap-2 mt-2 ml-6">
          <div><label class="text-xs">Mulai</label><input type="number" class="start-hour w-full border rounded p-1" data-day="${day}" value="${startHour}" min="0" max="23"><input type="number" class="start-minute w-full border rounded p-1 mt-1" data-day="${day}" value="${startMin}" min="0" max="59"></div>
          <div><label class="text-xs">Berhenti</label><input type="number" class="stop-hour w-full border rounded p-1" data-day="${day}" value="${stopHour}" min="0" max="23"><input type="number" class="stop-minute w-full border rounded p-1 mt-1" data-day="${day}" value="${stopMin}" min="0" max="59"></div>
        </div>
      `;
      container.appendChild(div);
    }
    toggleHybridPanel();
    document.getElementById('controlPanel').classList.remove('hidden');
  }

  function toggleHybridPanel() {
    const mode = document.getElementById('mode').value;
    document.getElementById('hybridPanel').style.display = mode === 'hybrid' ? 'block' : 'none';
  }

  function updateForceButtonsUI() {
    // optional: ubah warna tombol atau tampilkan teks
    console.log('Force Start:', window.forceStartState, 'Force Stop:', window.forceStopState);
  }

  async function setForce(value, type) {
    if(!currentAccount) return;
    const ref = db.ref(`ea_controls/${currentAccount}`);
    await ref.update({ [type]: value, last_updated: Date.now() });
    if(type === 'force_start') window.forceStartState = value;
    if(type === 'force_stop') window.forceStopState = value;
    updateForceButtonsUI();
    showMessage(`Force ${type} = ${value}`, false);
  }

  async function saveControls() {
    if(!currentAccount) { alert('Load akun terlebih dahulu'); return; }
    const enabled = document.getElementById('enabled').checked;
    const mode = document.getElementById('mode').value;
    
    // Kumpulkan jadwal per hari
    const schedule = {};
    for(let i=0; i<days.length; i++) {
      const day = days[i];
      const enabledCheck = document.querySelector(`.day-enabled[data-day="${day}"]`).checked;
      const startHour = parseInt(document.querySelector(`.start-hour[data-day="${day}"]`).value);
      const startMin = parseInt(document.querySelector(`.start-minute[data-day="${day}"]`).value);
      const stopHour = parseInt(document.querySelector(`.stop-hour[data-day="${day}"]`).value);
      const stopMin = parseInt(document.querySelector(`.stop-minute[data-day="${day}"]`).value);
      schedule[day] = {
        enabled: enabledCheck,
        start_hour: startHour,
        start_minute: startMin,
        stop_hour: stopHour,
        stop_minute: stopMin
      };
    }
    
    const payload = {
      enabled: enabled,
      mode: mode,
      schedule: schedule,
      last_updated: Date.now()
    };
    // Jangan overwrite force_start/force_stop jika tidak diubah, kita update hanya field yang ada
    try {
      await db.ref(`ea_controls/${currentAccount}`).update(payload);
      showMessage('Pengaturan berhasil disimpan!', false);
    } catch(err) {
      console.error(err);
      showMessage('Gagal menyimpan: ' + err.message, true);
    }
  }

  function showMessage(msg, isError) {
    const el = document.getElementById('statusMsg');
    el.innerText = msg;
    el.className = `text-sm text-center mt-2 ${isError ? 'text-red-600' : 'text-green-600'}`;
    setTimeout(() => el.innerText = '', 3000);
  }

  document.getElementById('loadBtn').addEventListener('click', loadControls);
  document.getElementById('mode').addEventListener('change', toggleHybridPanel);
  document.getElementById('saveBtn').addEventListener('click', saveControls);
  document.getElementById('forceStartBtn').addEventListener('click', () => setForce(true, 'force_start'));
  document.getElementById('forceStopBtn').addEventListener('click', () => setForce(true, 'force_stop'));
  document.getElementById('resetForceBtn').addEventListener('click', async () => {
    if(!currentAccount) return;
    await db.ref(`ea_controls/${currentAccount}`).update({ force_start: false, force_stop: false, last_updated: Date.now() });
    window.forceStartState = false;
    window.forceStopState = false;
    updateForceButtonsUI();
    showMessage('Force reset', false);
  });
});
</script>
</body>
</html>
