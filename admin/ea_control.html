<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA Control Panel - KiroiX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-50 p-4">
<div class="max-w-6xl mx-auto">
  <div class="flex flex-wrap justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-blue-600">EA Control Panel</h1>
    <a href="index.html" class="bg-gray-500 text-white px-4 py-2 rounded-lg">← Admin</a>
  </div>

  <!-- Pencarian / Pemilihan Akun -->
  <div class="bg-white rounded-xl shadow-md p-6 mb-6">
    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="block font-medium mb-1">Pilih Akun Aktif (dari License History)</label>
        <select id="accountSelect" class="border rounded p-2 w-full">
          <option value="">-- Muat daftar akun --</option>
        </select>
      </div>
      <div>
        <label class="block font-medium mb-1">Atau masukkan nomor akun manual</label>
        <input type="text" id="accountNumber" class="border rounded p-2 w-full" placeholder="183969086">
      </div>
    </div>
    <div class="flex gap-3 mt-4">
      <button id="loadBtn" class="bg-blue-600 text-white px-4 py-2 rounded">Load Kontrol</button>
      <button id="batchApplyBtn" class="bg-purple-600 text-white px-4 py-2 rounded">Apply ke Semua Akun Aktif</button>
    </div>
  </div>

  <!-- Panel Kontrol (akan tampil setelah load) -->
  <div id="controlPanel" class="bg-white rounded-xl shadow-md p-6 hidden">
    <h2 class="text-xl font-semibold mb-4">Pengaturan EA untuk Akun <span id="displayAccount"></span></h2>
    
    <div class="grid md:grid-cols-2 gap-6">
      <div>
        <div class="mb-4">
          <label class="inline-flex items-center">
            <input type="checkbox" id="enabled" class="mr-2"> <span class="font-medium">Enable EA (Start/Stop Global)</span>
          </label>
        </div>
        <div class="mb-4">
          <label class="block font-medium">Mode Operasi</label>
          <select id="mode" class="border rounded p-2 w-full">
            <option value="auto">Auto (Gunakan Time Filter Internal EA)</option>
            <option value="hybrid">Hybrid (Jadwal Per Hari)</option>
            <option value="manual">Manual (24 Jam, tanpa filter)</option>
          </select>
        </div>
        <div class="border-t pt-4 mb-4">
          <div class="font-medium mb-2">Force Control (Override Semua Filter)</div>
          <div class="flex flex-wrap gap-3">
            <button id="forceStartBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Force Start EA</button>
            <button id="forceStopBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">Force Stop EA</button>
            <button id="resetForceBtn" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded">Reset Force</button>
          </div>
          <p class="text-xs text-gray-500 mt-2">Force Start akan memaksa EA trading (abaikan jadwal). Force Stop akan menghentikan EA. Reset menghapus kedua force.</p>
        </div>
      </div>

      <div id="hybridPanel" class="border-l pl-6 hidden">
        <h3 class="font-bold text-lg mb-3">Jadwal Trading (Mode Hybrid)</h3>
        <div id="dailySchedules" class="space-y-4"></div>
      </div>
    </div>

    <div class="mt-6">
      <button id="saveBtn" class="bg-green-600 text-white px-6 py-2 rounded w-full">Simpan Pengaturan</button>
      <div id="statusMsg" class="text-sm text-center mt-2"></div>
    </div>
  </div>

  <div id="batchProgress" class="bg-white rounded-xl shadow-md p-4 mt-6 hidden">
    <h3 class="font-bold">Batch Update Progress</h3>
    <div id="batchLog" class="text-sm font-mono bg-gray-100 p-2 rounded h-40 overflow-y-auto"></div>
  </div>
</div>

<script src="../assets/js/firebase-config.js"></script>
<script>
requireAdmin().then(async () => {
  const db = firebase.database();
  let currentAccount = '';
  let allActiveAccounts = [];

  const accountSelect = document.getElementById('accountSelect');
  const accountInput = document.getElementById('accountNumber');
  const loadBtn = document.getElementById('loadBtn');
  const batchApplyBtn = document.getElementById('batchApplyBtn');
  const controlPanel = document.getElementById('controlPanel');
  const displayAccount = document.getElementById('displayAccount');
  const enabledCheck = document.getElementById('enabled');
  const modeSelect = document.getElementById('mode');
  const hybridPanel = document.getElementById('hybridPanel');
  const saveBtn = document.getElementById('saveBtn');
  const statusMsg = document.getElementById('statusMsg');
  const forceStartBtn = document.getElementById('forceStartBtn');
  const forceStopBtn = document.getElementById('forceStopBtn');
  const resetForceBtn = document.getElementById('resetForceBtn');
  const batchProgress = document.getElementById('batchProgress');
  const batchLog = document.getElementById('batchLog');

  const days = ['monday','tuesday','wednesday','thursday','friday'];
  const dayNames = ['Senin','Selasa','Rabu','Kamis','Jumat'];

  // --- Load daftar akun dari license_history_list (status ACTIVE) ---
  async function loadActiveAccounts() {
    try {
      const snapshot = await db.ref('license_history_list').once('value');
      const accountsMap = new Map(); // gunakan Map untuk menghindari duplikat (jika ada multiple entry)
      snapshot.forEach(child => {
        const data = child.val();
        if (data.status === 'ACTIVE' && data.account_number) {
          accountsMap.set(data.account_number, {
            account_number: data.account_number,
            investor_name: data.investor_name || '-'
          });
        }
      });
      // Jika tidak ada data dari history, coba dari /licenses (fallback)
      if (accountsMap.size === 0) {
        const licSnapshot = await db.ref('licenses').once('value');
        licSnapshot.forEach(child => {
          const license = child.val();
          if (license.status === 'ACTIVE') {
            accountsMap.set(child.key, { account_number: child.key, investor_name: '-' });
          }
        });
      }
      allActiveAccounts = Array.from(accountsMap.values());
      accountSelect.innerHTML = '<option value="">-- Pilih akun --</option>';
      allActiveAccounts.forEach(acc => {
        const option = document.createElement('option');
        option.value = acc.account_number;
        option.textContent = `${acc.account_number} (${acc.investor_name})`;
        accountSelect.appendChild(option);
      });
      if (allActiveAccounts.length === 0) {
        accountSelect.innerHTML = '<option value="">Tidak ada akun aktif</option>';
        console.warn('Tidak ada akun dengan status ACTIVE ditemukan.');
      } else {
        console.log(`Ditemukan ${allActiveAccounts.length} akun aktif.`);
      }
    } catch (err) {
      console.error('Gagal memuat daftar akun aktif:', err);
      accountSelect.innerHTML = '<option value="">Error memuat data</option>';
    }
  }

  // --- Load kontrol untuk akun tertentu ---
  async function loadControlsForAccount(account) {
    if (!account) return;
    currentAccount = account;
    displayAccount.innerText = currentAccount;
    const ref = db.ref(`ea_controls/${currentAccount}`);
    const snap = await ref.once('value');
    const data = snap.val() || {};
    
    enabledCheck.checked = data.enabled === true;
    modeSelect.value = data.mode || 'auto';
    
    window.currentForceStart = data.force_start === true;
    window.currentForceStop = data.force_stop === true;
    
    // Schedule hybrid
    const schedule = data.schedule || {};
    const container = document.getElementById('dailySchedules');
    container.innerHTML = '';
    for(let i=0; i<days.length; i++) {
      const day = days[i];
      const dayData = schedule[day] || {};
      const enabled = dayData.enabled === true;
      const startHour = dayData.start_hour !== undefined ? dayData.start_hour : 7;
      const startMin = dayData.start_minute !== undefined ? dayData.start_minute : 5;
      const stopHour = dayData.stop_hour !== undefined ? dayData.stop_hour : 23;
      const stopMin = dayData.stop_minute !== undefined ? dayData.stop_minute : 45;
      
      const div = document.createElement('div');
      div.className = 'border rounded p-3 bg-gray-50';
      div.innerHTML = `
        <label class="flex items-center gap-2 font-medium">
          <input type="checkbox" class="day-enabled" data-day="${day}" ${enabled ? 'checked' : ''}> ${dayNames[i]}
        </label>
        <div class="grid grid-cols-2 gap-2 mt-2 ml-6">
          <div><label class="text-xs">Mulai</label><input type="number" class="start-hour w-full border rounded p-1" data-day="${day}" value="${startHour}" min="0" max="23"><input type="number" class="start-minute w-full border rounded p-1 mt-1" data-day="${day}" value="${startMin}" min="0" max="59"></div>
          <div><label class="text-xs">Berhenti</label><input type="number" class="stop-hour w-full border rounded p-1" data-day="${day}" value="${stopHour}" min="0" max="23"><input type="number" class="stop-minute w-full border rounded p-1 mt-1" data-day="${day}" value="${stopMin}" min="0" max="59"></div>
        </div>
      `;
      container.appendChild(div);
    }
    toggleHybridPanel();
    controlPanel.classList.remove('hidden');
  }

  function toggleHybridPanel() {
    hybridPanel.style.display = modeSelect.value === 'hybrid' ? 'block' : 'none';
  }

  function getCurrentSettings() {
    const enabled = enabledCheck.checked;
    const mode = modeSelect.value;
    const schedule = {};
    for(let i=0; i<days.length; i++) {
      const day = days[i];
      const enabledCheckbox = document.querySelector(`.day-enabled[data-day="${day}"]`);
      const startHourInput = document.querySelector(`.start-hour[data-day="${day}"]`);
      const startMinuteInput = document.querySelector(`.start-minute[data-day="${day}"]`);
      const stopHourInput = document.querySelector(`.stop-hour[data-day="${day}"]`);
      const stopMinuteInput = document.querySelector(`.stop-minute[data-day="${day}"]`);
      if (enabledCheckbox && startHourInput) {
        schedule[day] = {
          enabled: enabledCheckbox.checked,
          start_hour: parseInt(startHourInput.value),
          start_minute: parseInt(startMinuteInput.value),
          stop_hour: parseInt(stopHourInput.value),
          stop_minute: parseInt(stopMinuteInput.value)
        };
      }
    }
    return {
      enabled: enabled,
      mode: mode,
      schedule: schedule,
      force_start: window.currentForceStart || false,
      force_stop: window.currentForceStop || false,
      last_updated: Date.now()
    };
  }

  async function saveToAccount(account, settings, showMessageToast = false) {
    try {
      await db.ref(`ea_controls/${account}`).update(settings);
      if (showMessageToast) showMessage(`Berhasil disimpan untuk akun ${account}`, false);
      return true;
    } catch (err) {
      if (showMessageToast) showMessage(`Gagal untuk ${account}: ${err.message}`, true);
      return false;
    }
  }

  async function batchApply() {
    if (allActiveAccounts.length === 0) {
      alert('Tidak ada akun aktif.');
      return;
    }
    if (!currentAccount) {
      alert('Harap load kontrol terlebih dahulu untuk satu akun sebagai referensi pengaturan.');
      return;
    }
    const settings = getCurrentSettings();
    batchProgress.classList.remove('hidden');
    batchLog.innerHTML = '';
    let successCount = 0;
    for (const acc of allActiveAccounts) {
      batchLog.innerHTML += `Memproses akun ${acc.account_number}...\n`;
      const ok = await saveToAccount(acc.account_number, settings, false);
      if (ok) {
        batchLog.innerHTML += `✅ Berhasil untuk ${acc.account_number}\n`;
        successCount++;
      } else {
        batchLog.innerHTML += `❌ Gagal untuk ${acc.account_number}\n`;
      }
      batchLog.scrollTop = batchLog.scrollHeight;
    }
    batchLog.innerHTML += `\nSelesai. ${successCount} dari ${allActiveAccounts.length} akun berhasil diupdate.\n`;
  }

  loadBtn.addEventListener('click', async () => {
    const manual = accountInput.value.trim();
    const selected = accountSelect.value;
    const account = manual || selected;
    if (!account) {
      alert('Pilih atau masukkan nomor akun.');
      return;
    }
    await loadControlsForAccount(account);
  });

  batchApplyBtn.addEventListener('click', async () => {
    if (confirm(`Terapkan pengaturan saat ini ke ${allActiveAccounts.length} akun aktif?`)) {
      await batchApply();
    }
  });

  modeSelect.addEventListener('change', toggleHybridPanel);
  
  saveBtn.addEventListener('click', async () => {
    if (!currentAccount) return;
    const settings = getCurrentSettings();
    await saveToAccount(currentAccount, settings, true);
  });

  forceStartBtn.addEventListener('click', async () => {
    if (!currentAccount) return;
    window.currentForceStart = true;
    window.currentForceStop = false;
    await db.ref(`ea_controls/${currentAccount}`).update({ force_start: true, force_stop: false, last_updated: Date.now() });
    showMessage('Force Start diaktifkan', false);
  });
  forceStopBtn.addEventListener('click', async () => {
    if (!currentAccount) return;
    window.currentForceStart = false;
    window.currentForceStop = true;
    await db.ref(`ea_controls/${currentAccount}`).update({ force_start: false, force_stop: true, last_updated: Date.now() });
    showMessage('Force Stop diaktifkan', false);
  });
  resetForceBtn.addEventListener('click', async () => {
    if (!currentAccount) return;
    window.currentForceStart = false;
    window.currentForceStop = false;
    await db.ref(`ea_controls/${currentAccount}`).update({ force_start: false, force_stop: false, last_updated: Date.now() });
    showMessage('Force direset', false);
  });

  function showMessage(msg, isError) {
    statusMsg.innerText = msg;
    statusMsg.className = `text-sm text-center mt-2 ${isError ? 'text-red-600' : 'text-green-600'}`;
    setTimeout(() => statusMsg.innerText = '', 3000);
  }

  // Inisialisasi
  await loadActiveAccounts();
});
</script>
</body>
</html>
