<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Kryon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>body{background:#F8FAFC}</style>
</head>
<body class="p-4">
  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-blue-600">Admin Panel</h1>
      <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg">Logout</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <a href="generate.html" class="bg-white p-6 rounded-xl shadow-md text-center hover:shadow-lg transition">
        <div class="text-3xl mb-2">🔑</div>
        <h2 class="text-xl font-semibold">Generate License</h2>
        <p class="text-gray-500">Buat lisensi baru untuk akun</p>
      </a>
      <a href="monitoring.html" class="bg-white p-6 rounded-xl shadow-md text-center hover:shadow-lg transition">
        <div class="text-3xl mb-2">📊</div>
        <h2 class="text-xl font-semibold">Monitoring</h2>
        <p class="text-gray-500">Cek status akun, heartbeat, daily summary</p>
      </a>
      <a href="history.html" class="bg-white p-6 rounded-xl shadow-md text-center hover:shadow-lg transition">
        <div class="text-3xl mb-2">📜</div>
        <h2 class="text-xl font-semibold">License History</h2>
        <p class="text-gray-500">Lihat semua lisensi & data investor</p>
      </a>
      <a href="investor_monitoring.html" class="bg-white p-6 rounded-xl shadow-md text-center hover:shadow-lg transition">
        <div class="text-3xl mb-2">📈</div>
        <h2 class="text-xl font-semibold">Investor Monitoring</h2>
        <p class="text-gray-500">Pantau growth & daily profit (read‑only)</p>
      </a>
    </div>
  </div>
  <script src="../assets/js/firebase-config.js"></script>
  <script>
    requireAdmin();
    document.getElementById('logoutBtn').onclick = () => firebase.auth().signOut().then(() => window.location.href='/');
  </script>
</body>
</html>
