<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiroiX AI Trade - Investor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .calendar-day { min-height: 85px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .calendar-day:hover { transform: scale(1.02); z-index: 10; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .bg-win-heavy { background-color: #22c55e; color: white; }
        .bg-win-light { background-color: #dcfce7; color: #166534; }
        .bg-loss-heavy { background-color: #ef4444; color: white; }
        .bg-loss-light { background-color: #fee2e2; color: #991b1b; }
        .bg-neutral { background-color: #f8fafc; color: #64748b; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased pb-12">

    <div class="max-w-6xl mx-auto px-4 pt-8">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-wrap gap-4 items-end justify-between">
            <div class="flex flex-wrap gap-4 items-end">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">Account Number</label>
                    <input type="text" id="accInput" value="1051057600" class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg w-48 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">Periode</label>
                    <div class="flex gap-2">
                        <select id="monthSel" class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg outline-none cursor-pointer"></select>
                        <select id="yearSel" class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg outline-none cursor-pointer"></select>
                    </div>
                </div>
                <button id="btnLoad" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-2.5 rounded-lg shadow-md shadow-blue-200 transition-all active:scale-95 flex items-center gap-2">
                    <span id="btnText">Tampilkan Data</span>
                    <div id="btnLoader" class="hidden loader w-4 h-4 border-2 border-white rounded-full"></div>
                </button>
            </div>
            <div class="text-right hidden md:block">
                <p class="text-xs text-slate-400 font-medium">Last Sync WITA</p>
                <p id="lastSync" class="font-bold text-slate-600">-</p>
            </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase">Initial Deposit</p>
                <p id="statDeposit" class="text-2xl font-bold text-slate-800 mt-1">$0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase">Current Equity</p>
                <p id="statEquity" class="text-2xl font-bold text-slate-800 mt-1">$0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase">Total Growth</p>
                <p id="statGrowth" class="text-2xl font-bold text-emerald-600 mt-1">0%</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase">Status</p>
                <p id="statStatus" class="text-2xl font-bold text-blue-600 mt-1">Standby</p>
            </div>
        </div>

        <div class="grid lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-slate-800">Monthly Performance</h2>
                    <div class="flex gap-2 items-center text-[10px] font-bold text-slate-400">
                        <span class="flex items-center gap-1"><i class="w-2 h-2 rounded-full bg-emerald-500"></i> Profit</span>
                        <span class="flex items-center gap-1"><i class="w-2 h-2 rounded-full bg-red-400"></i> Loss</span>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-2 mb-2">
                    <template id="dayNames">
                        <div class="text-center text-[10px] font-black text-slate-300 uppercase py-2">Minggu</div>
                    </template>
                </div>
                <div id="calGrid" class="grid grid-cols-7 gap-2"></div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold text-slate-800 mb-6">Equity Curve</h2>
                <div class="h-64 relative">
                    <canvas id="equityChart"></canvas>
                </div>
                <div class="mt-8 space-y-4">
                    <div class="p-4 bg-slate-50 rounded-xl">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Broker Server</p>
                        <p id="brokerName" class="font-bold text-slate-700">Waiting for data...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
// --- CONFIGURATION ---
// Silakan isi sesuai kredensial Firebase Anda
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    databaseURL: "https://kiroi-x-ecosystem-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "kiroi-x-ecosystem"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const mNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const dNames = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];

let chartInstance = null;

// --- INITIALIZATION ---
const mSel = document.getElementById('monthSel');
const ySel = document.getElementById('yearSel');
const now = new Date();

mNames.forEach((m, i) => mSel.innerHTML += `<option value="${i}" ${i==now.getMonth()?'selected':''}>${m}</option>`);
for(let y=2024; y<=2026; y++) ySel.innerHTML += `<option value="${y}" ${y==now.getFullYear()?'selected':''}>${y}</option>`;

// --- CORE LOGIC ---
document.getElementById('btnLoad').onclick = async () => {
    const acc = document.getElementById('accInput').value.trim();
    const month = parseInt(mSel.value);
    const year = parseInt(ySel.value);
    
    if(!acc) return alert("Masukkan Nomor Akun!");

    // UI Loading
    document.getElementById('btnLoader').classList.remove('hidden');
    document.getElementById('btnText').innerText = "Loading...";

    try {
        // 1. Fetch Metadata
        const metaSnap = await db.ref(`account_data/${acc}/metadata`).once('value');
        const meta = metaSnap.val();
        
        // 2. Fetch Snapshots
        const snap = await db.ref(`account_data/${acc}/snapshots`).once('value');
        const snapshotsRaw = snap.val();

        if(!snapshotsRaw) throw new Error("Data snapshots tidak ditemukan.");

        // 3. Process Data
        const dailyMap = new Map();
        const chartLabels = [];
        const chartData = [];
        
        // Urutkan Keys (Timestamp) secara ascending
        const sortedKeys = Object.keys(snapshotsRaw).sort((a,b) => parseInt(a) - parseInt(b));
        
        sortedKeys.forEach(ts => {
            const s = snapshotsRaw[ts];
            const d = new Date(parseInt(ts));
            const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
            
            // Simpan snapshot terakhir untuk hari itu
            dailyMap.set(key, s);
            
            // Data untuk Chart
            chartLabels.push(d.toLocaleDateString('id-ID', {day:'2-digit', month:'short'}));
            chartData.push(s.equity);
        });

        // 4. Update UI Stats
        const lastKey = sortedKeys[sortedKeys.length - 1];
        const latest = snapshotsRaw[lastKey];
        
        document.getElementById('statDeposit').innerText = `$${meta?.initial_deposit?.toLocaleString() || 0}`;
        document.getElementById('statEquity').innerText = `$${latest.equity?.toLocaleString()}`;
        document.getElementById('statGrowth').innerText = `${(latest.total_growth_percent || 0).toFixed(2)}%`;
        document.getElementById('brokerName').innerText = meta?.broker || "Unknown";
        document.getElementById('statStatus').innerText = "Online";
        
        const syncDate = new Date(meta?.last_update || parseInt(lastKey));
        document.getElementById('lastSync').innerText = syncDate.toLocaleTimeString('id-ID');

        // 5. Render Chart & Calendar
        updateChart(chartLabels, chartData);
        renderCalendar(year, month, dailyMap);

    } catch (e) {
        console.error(e);
        alert(e.message);
    } finally {
        document.getElementById('btnLoader').classList.add('hidden');
        document.getElementById('btnText').innerText = "Tampilkan Data";
    }
};

function renderCalendar(year, month, dailyMap) {
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    
    // Header Hari
    dNames.forEach(d => {
        grid.innerHTML += `<div class="text-center text-[10px] font-black text-slate-300 uppercase py-2">${d}</div>`;
    });

    const firstDay = new Date(year, month, 1);
    const startOffset = firstDay.getDay(); // 0 = Minggu
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    // Padding hari bulan sebelumnya
    for(let i=0; i < startOffset; i++) {
        grid.innerHTML += `<div class="calendar-day bg-transparent border border-transparent opacity-0"></div>`;
    }

    // Hari Aktif
    for (let d = 1; d <= daysInMonth; d++) {
        const dateKey = `${year}-${month}-${d}`;
        const dayData = dailyMap.get(dateKey);
        
        let colorClass = "bg-neutral";
        const growth = dayData ? parseFloat(dayData.daily_growth_percent) : 0;
        const profit = dayData ? parseFloat(dayData.daily_profit) : 0;

        if (growth > 0.01) colorClass = growth > 2 ? "bg-win-heavy" : "bg-win-light";
        else if (growth < -0.01) colorClass = growth < -2 ? "bg-loss-heavy" : "bg-loss-light";

        const div = document.createElement('div');
        div.className = `calendar-day p-2.5 rounded-xl border border-slate-100 flex flex-col justify-between ${colorClass}`;
        div.innerHTML = `
            <span class="text-[10px] font-black opacity-40">${d}</span>
            <div class="text-center">
                <span class="text-sm font-bold block">${dayData ? growth.toFixed(2)+'%' : '-'}</span>
                <span class="text-[9px] font-medium opacity-80">${dayData && profit != 0 ? '$'+profit.toFixed(0) : ''}</span>
            </div>
            <div></div>
        `;
        grid.appendChild(div);
    }
}

function updateChart(labels, data) {
    const ctx = document.getElementById('equityChart').getContext('2d');
    if(chartInstance) chartInstance.destroy();
    
    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Equity',
                data: data,
                borderColor: '#3b82f6',
                borderWidth: 3,
                pointRadius: 0,
                fill: true,
                backgroundColor: (context) => {
                    const gradient = context.chart.ctx.createLinearGradient(0, 0, 0, 400);
                    gradient.addColorStop(0, 'rgba(59, 130, 246, 0.2)');
                    gradient.addColorStop(1, 'rgba(59, 130, 246, 0)');
                    return gradient;
                },
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: {
                    grid: { color: '#f1f5f9' },
                    ticks: { font: { size: 10 } }
                }
            }
        }
    });
}
</script>
</body>
</html>
