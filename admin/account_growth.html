<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Account Growth - KiroiX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    body { background-color: #F8FAFC; }
    .calendar-day {
      transition: all 0.2s;
      cursor: pointer;
    }
    .calendar-day:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      z-index: 10;
      position: relative;
    }
    .tooltip-info {
      position: absolute;
      background: #1e293b;
      color: #f1f5f9;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 20;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      pointer-events: none;
    }
    /* Soft color palette for calendar */
    .bg-soft-green-dark { background-color: #86efac; }  /* >2% */
    .bg-soft-green { background-color: #bbf7d0; }       /* 1-2% */
    .bg-soft-green-light { background-color: #dcfce7; } /* 0.5-1% */
    .bg-soft-yellow { background-color: #fef9c3; }      /* 0-0.5% */
    .bg-soft-orange { background-color: #fed7aa; }      /* -0.5-0% */
    .bg-soft-red-light { background-color: #fecaca; }   /* -1 to -0.5% */
    .bg-soft-red { background-color: #fca5a5; }         /* <-1% */
    .bg-soft-gray { background-color: #f1f5f9; }        /* no data */
  </style>
</head>
<body class="p-4">
<div class="max-w-full mx-auto">
  <div class="flex flex-wrap justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-blue-600">Account Growth Monitor</h1>
    <a href="index.html" class="bg-gray-500 text-white px-4 py-2 rounded-lg">← Admin</a>
  </div>

  <!-- Pencarian akun & pilihan bulan/tahun -->
  <div class="bg-white rounded-xl shadow-md p-4 mb-6">
    <div class="flex flex-col sm:flex-row gap-2">
      <input type="text" id="accountNumber" placeholder="Nomor Akun" class="border rounded p-2 flex-1" autocomplete="off">
      <select id="monthPicker" class="border rounded p-2"></select>
      <select id="yearPicker" class="border rounded p-2"></select>
      <button id="loadBtn" class="bg-blue-600 text-white px-6 py-2 rounded">Tampilkan</button>
    </div>
  </div>

  <!-- Ringkasan cards -->
  <div id="summaryCards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 hidden">
    <div class="bg-white p-4 rounded-xl shadow"><div class="text-gray-500">Initial Deposit</div><div class="text-2xl font-bold" id="initDeposit">-</div></div>
    <div class="bg-white p-4 rounded-xl shadow"><div class="text-gray-500">Latest Equity</div><div class="text-2xl font-bold" id="latestEquity">-</div></div>
    <div class="bg-white p-4 rounded-xl shadow"><div class="text-gray-500">Total Growth %</div><div class="text-2xl font-bold" id="totalGrowth">-</div></div>
    <div class="bg-white p-4 rounded-xl shadow"><div class="text-gray-500">Max Drawdown %</div><div class="text-2xl font-bold" id="maxDrawdown">-</div></div>
  </div>

  <!-- Line chart all time (equity growth) -->
  <div class="bg-white rounded-xl shadow p-4 mb-6 hidden" id="chartContainer">
    <div class="flex justify-between items-center mb-2">
      <h3 class="font-semibold text-gray-700">Equity Growth (All Time)</h3>
      <div class="text-xs text-gray-400" id="chartRangeInfo"></div>
    </div>
    <canvas id="balanceChart" height="100"></canvas>
    <p class="text-xs text-gray-400 mt-2 text-center">*Grafik menampilkan seluruh riwayat equity sejak deposit pertama</p>
  </div>

  <!-- Calendar View -->
  <div class="bg-white rounded-xl shadow p-4 mb-6 hidden" id="calendarContainer">
    <h3 class="font-bold text-lg mb-3 text-center" id="calendarTitle"></h3>
    <div class="grid grid-cols-7 gap-1 text-center text-sm font-medium bg-gray-100 p-2 rounded-t">
      <div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div><div>Min</div>
    </div>
    <div id="calendarGrid" class="grid grid-cols-7 gap-1 mt-1"></div>
    <div class="text-xs text-gray-500 mt-3 text-center flex justify-center gap-3 flex-wrap">
      <span><span class="inline-block w-3 h-3 bg-soft-green-dark rounded"></span> >2%</span>
      <span><span class="inline-block w-3 h-3 bg-soft-green rounded"></span> 1-2%</span>
      <span><span class="inline-block w-3 h-3 bg-soft-green-light rounded"></span> 0.5-1%</span>
      <span><span class="inline-block w-3 h-3 bg-soft-yellow rounded"></span> 0-0.5%</span>
      <span><span class="inline-block w-3 h-3 bg-soft-orange rounded"></span> -0.5-0%</span>
      <span><span class="inline-block w-3 h-3 bg-soft-red-light rounded"></span> -1 to -0.5%</span>
      <span><span class="inline-block w-3 h-3 bg-soft-red rounded"></span> <-1%</span>
      <span><span class="inline-block w-3 h-3 bg-soft-gray rounded"></span> No data</span>
    </div>
  </div>

  <div id="loadingMsg" class="text-center text-gray-500">Masukkan nomor akun</div>
</div>

<script src="../assets/js/firebase-config.js"></script>
<script>
requireAdmin().then(() => {
  const db = firebase.database();
  let currentAccount = '';
  let balanceChart = null;

  const monthPicker = document.getElementById('monthPicker');
  const yearPicker = document.getElementById('yearPicker');
  const now = new Date();
  for(let i=0;i<12;i++) monthPicker.innerHTML += `<option value="${i}">${new Date(2000,i,1).toLocaleString('id-ID',{month:'long'})}</option>`;
  monthPicker.value = now.getMonth();
  for(let y=now.getFullYear()-2; y<=now.getFullYear()+1; y++) yearPicker.innerHTML += `<option value="${y}">${y}</option>`;
  yearPicker.value = now.getFullYear();

  document.getElementById('loadBtn').addEventListener('click', async () => {
    const acc = document.getElementById('accountNumber').value.trim();
    if(!acc) return alert('Masukkan nomor akun');
    currentAccount = acc;
    await loadData(acc, parseInt(yearPicker.value), parseInt(monthPicker.value));
  });

  function getGrowthColorClass(growth) {
    if(growth === null) return 'bg-soft-gray';
    if(growth > 2) return 'bg-soft-green-dark';
    if(growth > 1) return 'bg-soft-green';
    if(growth > 0.5) return 'bg-soft-green-light';
    if(growth >= 0) return 'bg-soft-yellow';
    if(growth >= -0.5) return 'bg-soft-orange';
    if(growth >= -1) return 'bg-soft-red-light';
    return 'bg-soft-red';
  }

  async function loadData(account, year, month) {
    // Ambil metadata
    const metaSnap = await db.ref(`account_data/${account}/metadata`).once('value');
    const meta = metaSnap.val();
    if(!meta) {
      document.getElementById('loadingMsg').innerHTML = 'Akun tidak ditemukan. Pastikan EA monitor sudah berjalan dan mengirim data.';
      document.getElementById('summaryCards').classList.add('hidden');
      document.getElementById('chartContainer').classList.add('hidden');
      document.getElementById('calendarContainer').classList.add('hidden');
      return;
    }

    // Ambil semua snapshot
    const snapshotsRef = db.ref(`account_data/${account}/snapshots`);
    const snap = await snapshotsRef.once('value');
    const snapshots = [];
    snap.forEach(child => {
      const ts = parseInt(child.key);
      const val = child.val();
      snapshots.push({ ts, ...val });
    });
    snapshots.sort((a,b) => a.ts - b.ts);
    if(snapshots.length === 0) {
      document.getElementById('loadingMsg').innerHTML = 'Belum ada data snapshot. Tunggu EA monitor.';
      return;
    }

    // Ringkasan
    const latest = snapshots[snapshots.length-1];
    const initDeposit = meta.initial_deposit || latest.balance;
    const totalGrowth = ((latest.equity - initDeposit) / initDeposit * 100).toFixed(2);
    let maxDraw = 0;
    snapshots.forEach(s => { if(s.drawdown > maxDraw) maxDraw = s.drawdown; });

    document.getElementById('initDeposit').innerText = `$${initDeposit.toFixed(2)}`;
    document.getElementById('latestEquity').innerText = `$${latest.equity.toFixed(2)}`;
    document.getElementById('totalGrowth').innerHTML = `<span class="${totalGrowth>=0?'text-green-600':'text-red-600'}">${totalGrowth}%</span>`;
    document.getElementById('maxDrawdown').innerHTML = `<span class="text-red-600">${maxDraw.toFixed(2)}%</span>`;
    document.getElementById('summaryCards').classList.remove('hidden');

    // Line chart ALL TIME (semua snapshot)
    const allLabels = snapshots.map(s => new Date(s.ts + 8*3600*1000).toLocaleDateString('id-ID'));
    const equityData = snapshots.map(s => s.equity);
    if(balanceChart) balanceChart.destroy();
    const ctx = document.getElementById('balanceChart').getContext('2d');
    balanceChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: allLabels,
        datasets: [{
          label: 'Equity Growth',
          data: equityData,
          borderColor: '#3B82F6',
          backgroundColor: 'rgba(59,130,246,0.05)',
          fill: true,
          tension: 0.2,
          pointRadius: 2,
          pointHoverRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          tooltip: { callbacks: { label: (ctx) => `Equity: $${ctx.raw.toFixed(2)}` } }
        },
        scales: { y: { beginAtZero: false, title: { display: true, text: 'Equity ($)' } } }
      }
    });
    document.getElementById('chartContainer').classList.remove('hidden');
    document.getElementById('chartRangeInfo').innerText = `${snapshots.length} data points | ${allLabels[0]} to ${allLabels[allLabels.length-1]}`;

    // Calendar: kelompokkan per hari berdasarkan daily_growth_percent
    const dailyMap = new Map();
    snapshots.forEach(s => {
      const witaDate = new Date(s.ts + 8*3600*1000);
      const dateKey = witaDate.toISOString().slice(0,10);
      if(!dailyMap.has(dateKey) || dailyMap.get(dateKey).ts < s.ts) {
        dailyMap.set(dateKey, { growth: s.daily_growth_percent, ts: s.ts, equity: s.equity, daily_profit: s.daily_profit });
      }
    });

    // Generate kalender untuk bulan tertentu
    const firstDayOfMonth = new Date(year, month, 1);
    let start = new Date(firstDayOfMonth);
    if(start.getDay() === 0) start.setDate(start.getDate() - 6);
    else if(start.getDay() !== 1) start.setDate(start.getDate() - (start.getDay() - 1));
    const endDate = new Date(year, month+1, 0);
    const calendarDays = [];
    let current = new Date(start);
    while(current <= endDate || calendarDays.length % 7 !== 0) {
      calendarDays.push(new Date(current));
      current.setDate(current.getDate() + 1);
    }

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    calendarDays.forEach(day => {
      const dateKey = day.toISOString().slice(0,10);
      const snapDay = dailyMap.get(dateKey);
      let growth = snapDay ? snapDay.growth : null;
      const bgClass = getGrowthColorClass(growth);
      const isCurrentMonth = day.getMonth() === month;
      const opacity = isCurrentMonth ? '' : 'opacity-50';
      const div = document.createElement('div');
      div.className = `calendar-day ${bgClass} ${opacity} rounded-lg p-2 text-center text-sm transition relative`;
      div.innerHTML = `<div class="font-bold ${isCurrentMonth ? 'text-gray-800' : 'text-gray-400'}">${day.getDate()}</div><div class="text-xs text-gray-600">${growth !== null ? growth.toFixed(2)+'%' : '-'}</div>`;
      if(snapDay) {
        div.addEventListener('mouseenter', (e) => {
          const tooltip = document.createElement('div');
          tooltip.className = 'tooltip-info';
          tooltip.innerHTML = `Daily Growth: ${growth.toFixed(2)}%<br>Equity: $${snapDay.equity?.toFixed(2)}<br>Daily Profit: $${snapDay.daily_profit?.toFixed(2)}`;
          document.body.appendChild(tooltip);
          const rect = div.getBoundingClientRect();
          tooltip.style.left = rect.left + window.scrollX + 'px';
          tooltip.style.top = rect.top + window.scrollY - 35 + 'px';
          div._tooltip = tooltip;
        });
        div.addEventListener('mouseleave', () => {
          if(div._tooltip) div._tooltip.remove();
        });
      }
      grid.appendChild(div);
    });

    document.getElementById('calendarTitle').innerText = `${new Date(year, month).toLocaleString('id-ID', {month:'long', year:'numeric'})}`;
    document.getElementById('calendarContainer').classList.remove('hidden');
    document.getElementById('loadingMsg').classList.add('hidden');
  }
});
</script>
</body>
</html>
