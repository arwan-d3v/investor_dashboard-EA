<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Account Growth - KiroiX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    body { background-color: #F8FAFC; }
    .calendar-day {
      transition: all 0.2s;
      cursor: pointer;
    }
    .calendar-day:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .tooltip-info {
      position: absolute;
      background: #1f2937;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body class="p-4">
<div class="max-w-7xl mx-auto">
  <div class="flex flex-wrap justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-blue-600">Account Growth Monitor</h1>
    <a href="index.html" class="bg-gray-500 text-white px-4 py-2 rounded-lg">← Admin</a>
  </div>

  <!-- Pencarian akun -->
  <div class="bg-white rounded-xl shadow-md p-4 mb-6">
    <div class="flex flex-col sm:flex-row gap-2">
      <input type="text" id="accountNumber" placeholder="Nomor Akun" class="border rounded p-2 flex-1">
      <select id="monthPicker" class="border rounded p-2">
        <!-- akan diisi JS -->
      </select>
      <select id="yearPicker" class="border rounded p-2">
        <!-- akan diisi JS -->
      </select>
      <button id="loadBtn" class="bg-blue-600 text-white px-6 py-2 rounded">Tampilkan</button>
    </div>
  </div>

  <!-- Ringkasan cards -->
  <div id="summaryCards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 hidden">
    <div class="bg-white p-4 rounded-xl shadow"><div class="text-gray-500">Initial Deposit</div><div class="text-2xl font-bold" id="initDeposit">-</div></div>
    <div class="bg-white p-4 rounded-xl shadow"><div class="text-gray-500">Latest Equity</div><div class="text-2xl font-bold" id="latestEquity">-</div></div>
    <div class="bg-white p-4 rounded-xl shadow"><div class="text-gray-500">Total Growth %</div><div class="text-2xl font-bold" id="totalGrowth">-</div></div>
    <div class="bg-white p-4 rounded-xl shadow"><div class="text-gray-500">Max Drawdown %</div><div class="text-2xl font-bold" id="maxDrawdown">-</div></div>
  </div>

  <!-- Line chart balance growth -->
  <div class="bg-white rounded-xl shadow p-4 mb-6 hidden" id="chartContainer">
    <canvas id="balanceChart" height="100"></canvas>
  </div>

  <!-- Calendar View -->
  <div class="bg-white rounded-xl shadow p-4 mb-6 hidden" id="calendarContainer">
    <h3 class="font-bold text-lg mb-3 text-center" id="calendarTitle"></h3>
    <div class="grid grid-cols-7 gap-1 text-center text-sm font-medium bg-gray-100 p-2 rounded-t">
      <div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div><div>Min</div>
    </div>
    <div id="calendarGrid" class="grid grid-cols-7 gap-1 mt-1"></div>
    <div class="text-xs text-gray-500 mt-3 text-center flex justify-center gap-4 flex-wrap">
      <span><span class="inline-block w-3 h-3 bg-green-700 rounded"></span> >2%</span>
      <span><span class="inline-block w-3 h-3 bg-green-500 rounded"></span> 1-2%</span>
      <span><span class="inline-block w-3 h-3 bg-green-300 rounded"></span> 0.5-1%</span>
      <span><span class="inline-block w-3 h-3 bg-yellow-200 rounded"></span> 0-0.5%</span>
      <span><span class="inline-block w-3 h-3 bg-red-300 rounded"></span> -0.5-0%</span>
      <span><span class="inline-block w-3 h-3 bg-red-500 rounded"></span> -1 to -0.5%</span>
      <span><span class="inline-block w-3 h-3 bg-red-700 rounded"></span> <-1%</span>
      <span><span class="inline-block w-3 h-3 bg-gray-200 rounded"></span> No data</span>
    </div>
  </div>

  <div id="loadingMsg" class="text-center text-gray-500">Masukkan nomor akun</div>
</div>

<script src="../assets/js/firebase-config.js"></script>
<script>
requireAdmin().then(() => {
  const db = firebase.database();
  let currentAccount = '';
  let balanceChart = null;

  const monthPicker = document.getElementById('monthPicker');
  const yearPicker = document.getElementById('yearPicker');
  const now = new Date();
  for(let i=0; i<12; i++) {
    const d = new Date(2000, i, 1);
    monthPicker.innerHTML += `<option value="${i}">${d.toLocaleString('id-ID', {month:'long'})}</option>`;
  }
  monthPicker.value = now.getMonth();
  for(let y=now.getFullYear()-2; y<=now.getFullYear()+1; y++) {
    yearPicker.innerHTML += `<option value="${y}">${y}</option>`;
  }
  yearPicker.value = now.getFullYear();

  document.getElementById('loadBtn').addEventListener('click', async () => {
    const acc = document.getElementById('accountNumber').value.trim();
    if(!acc) return alert('Masukkan nomor akun');
    currentAccount = acc;
    const year = parseInt(yearPicker.value);
    const month = parseInt(monthPicker.value);
    await loadGrowthData(acc, year, month);
  });

  async function loadGrowthData(account, year, month) {
    const metadataRef = db.ref(`account_data/${account}/metadata`);
    const metaSnap = await metadataRef.once('value');
    const meta = metaSnap.val();
    if(!meta) {
      document.getElementById('loadingMsg').innerHTML = 'Akun tidak ditemukan. Pastikan EA monitor sudah berjalan.';
      document.getElementById('summaryCards').classList.add('hidden');
      document.getElementById('chartContainer').classList.add('hidden');
      document.getElementById('calendarContainer').classList.add('hidden');
      return;
    }

    const snapshotsRef = db.ref(`account_data/${account}/snapshots`);
    const snap = await snapshotsRef.once('value');
    const snapshots = [];
    snap.forEach(child => {
      const ts = parseInt(child.key);
      const val = child.val();
      snapshots.push({ ts, ...val });
    });
    snapshots.sort((a,b) => a.ts - b.ts);
    if(snapshots.length === 0) {
      document.getElementById('loadingMsg').innerHTML = 'Belum ada data snapshot. Tunggu EA monitor.';
      return;
    }

    // Hitung ringkasan
    const latest = snapshots[snapshots.length-1];
    const initDeposit = meta.initial_deposit || latest.balance;
    const totalGrowth = ((latest.equity - initDeposit) / initDeposit * 100).toFixed(2);
    let maxDraw = 0;
    snapshots.forEach(s => { if(s.drawdown > maxDraw) maxDraw = s.drawdown; });

    document.getElementById('initDeposit').innerText = `$${initDeposit.toFixed(2)}`;
    document.getElementById('latestEquity').innerText = `$${latest.equity.toFixed(2)}`;
    document.getElementById('totalGrowth').innerHTML = `<span class="${totalGrowth>=0?'text-green-600':'text-red-600'}">${totalGrowth}%</span>`;
    document.getElementById('maxDrawdown').innerHTML = `<span class="text-red-600">${maxDraw.toFixed(2)}%</span>`;
    document.getElementById('summaryCards').classList.remove('hidden');

    // Line chart (30 hari terakhir)
    const last30 = snapshots.slice(-30);
    const labels = last30.map(s => new Date(s.ts).toLocaleDateString('id-ID'));
    const balanceData = last30.map(s => s.balance);
    if(balanceChart) balanceChart.destroy();
    const ctx = document.getElementById('balanceChart').getContext('2d');
    balanceChart = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: [{ label: 'Balance', data: balanceData, borderColor: '#3B82F6', fill: false }] },
      options: { responsive: true, maintainAspectRatio: true }
    });
    document.getElementById('chartContainer').classList.remove('hidden');

    // Calendar: kelompokkan per hari berdasarkan daily_growth_percent
    const dailyMap = new Map(); // key: YYYY-MM-DD
    snapshots.forEach(s => {
      const dateObj = new Date(s.ts);
      // Gunakan WITA untuk tanggal (utc + 8)
      const witaDate = new Date(s.ts + 8*3600*1000);
      const dateKey = witaDate.toISOString().slice(0,10);
      if(!dailyMap.has(dateKey) || dailyMap.get(dateKey).ts < s.ts) {
        dailyMap.set(dateKey, { growth: s.daily_growth_percent, ts: s.ts });
      }
    });

    // Generate kalender untuk bulan tertentu
    const firstDayOfMonth = new Date(year, month, 1);
    const startDate = new Date(year, month, 1);
    // Geser ke Senin pertama
    let start = new Date(startDate);
    if(start.getDay() === 0) start.setDate(start.getDate() - 6);
    else if(start.getDay() !== 1) start.setDate(start.getDate() - (start.getDay() - 1));
    
    const endDate = new Date(year, month+1, 0);
    const calendarDays = [];
    let current = new Date(start);
    while(current <= endDate || calendarDays.length % 7 !== 0) {
      calendarDays.push(new Date(current));
      current.setDate(current.getDate() + 1);
    }

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    calendarDays.forEach(day => {
      const dateKey = day.toISOString().slice(0,10);
      const snapshot = dailyMap.get(dateKey);
      let growth = null;
      if(snapshot) growth = snapshot.growth;
      let bgColor = 'bg-gray-100';
      if(growth !== null) {
        if(growth > 2) bgColor = 'bg-green-700';
        else if(growth > 1) bgColor = 'bg-green-500';
        else if(growth > 0.5) bgColor = 'bg-green-300';
        else if(growth >= 0) bgColor = 'bg-yellow-200';
        else if(growth >= -0.5) bgColor = 'bg-red-300';
        else if(growth >= -1) bgColor = 'bg-red-500';
        else bgColor = 'bg-red-700';
      }
      const isCurrentMonth = day.getMonth() === month;
      const opacity = isCurrentMonth ? 'opacity-100' : 'opacity-50';
      const div = document.createElement('div');
      div.className = `calendar-day ${bgColor} ${opacity} rounded-lg p-2 text-center text-sm transition relative`;
      div.innerHTML = `<div class="font-bold">${day.getDate()}</div><div class="text-xs">${growth !== null ? growth.toFixed(2)+'%' : '-'}</div>`;
      if(snapshot) {
        div.addEventListener('mouseenter', (e) => {
          const tooltip = document.createElement('div');
          tooltip.className = 'tooltip-info';
          tooltip.innerHTML = `Daily Growth: ${growth.toFixed(2)}%<br>Equity: $${snapshot.equity?.toFixed(2)}<br>Profit: $${snapshot.daily_profit?.toFixed(2)}`;
          document.body.appendChild(tooltip);
          const rect = div.getBoundingClientRect();
          tooltip.style.left = rect.left + window.scrollX + 'px';
          tooltip.style.top = rect.top + window.scrollY - 30 + 'px';
          div._tooltip = tooltip;
        });
        div.addEventListener('mouseleave', () => {
          if(div._tooltip) div._tooltip.remove();
        });
      }
      grid.appendChild(div);
    });

    document.getElementById('calendarTitle').innerText = `${new Date(year, month).toLocaleString('id-ID', {month:'long', year:'numeric'})}`;
    document.getElementById('calendarContainer').classList.remove('hidden');
    document.getElementById('loadingMsg').classList.add('hidden');
  }
});
</script>
</body>
</html>
