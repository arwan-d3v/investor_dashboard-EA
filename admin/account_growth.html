<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiroiX Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    .calendar-day { min-height: 70px; transition: 0.2s; }
    .calendar-day:hover { transform: translateY(-2px); z-index: 10; shadow: lg; }
    .bg-win { background-color: #dcfce7; color: #166534; }
    .bg-loss { background-color: #fee2e2; color: #991b1b; }
    .bg-empty { background-color: #f8fafc; color: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 p-4">
  <div class="max-w-5xl mx-auto">
    <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap gap-3 items-center">
      <input type="text" id="accInput" placeholder="Acc Number" class="border p-2 rounded w-40">
      <select id="monthSel" class="border p-2 rounded"></select>
      <select id="yearSel" class="border p-2 rounded"></select>
      <button id="btnLoad" class="bg-blue-600 text-white px-6 py-2 rounded font-bold">Load Data</button>
    </div>

    <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 hidden">
      <div class="bg-white p-4 rounded-lg shadow-sm">
        <div class="text-xs text-slate-400 uppercase">Growth</div>
        <div id="statGrowth" class="text-xl font-bold">-</div>
      </div>
      <div id="calendarCard" class="col-span-full bg-white p-6 rounded-xl shadow-sm">
        <h3 id="calTitle" class="text-center font-bold text-lg mb-4 text-slate-700"></h3>
        <div class="grid grid-cols-7 gap-2">
          <div class="text-center text-xs font-bold text-slate-400 py-2">MIN</div>
          <div class="text-center text-xs font-bold text-slate-400 py-2">SEN</div>
          <div class="text-center text-xs font-bold text-slate-400 py-2">SEL</div>
          <div class="text-center text-xs font-bold text-slate-400 py-2">RAB</div>
          <div class="text-center text-xs font-bold text-slate-400 py-2">KAM</div>
          <div class="text-center text-xs font-bold text-slate-400 py-2">JUM</div>
          <div class="text-center text-xs font-bold text-slate-400 py-2">SAB</div>
        </div>
        <div id="calGrid" class="grid grid-cols-7 gap-2"></div>
      </div>
    </div>
  </div>

<script src="../assets/js/firebase-config.js"></script>
<script>
const db = firebase.database();
const mNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

// Init Pickers
const mSel = document.getElementById('monthSel');
const ySel = document.getElementById('yearSel');
mNames.forEach((m, i) => mSel.innerHTML += `<option value="${i}">${m}</option>`);
mSel.value = new Date().getMonth();
for(let y=2024; y<=2026; y++) ySel.innerHTML += `<option value="${y}">${y}</option>`;
ySel.value = 2026;

document.getElementById('btnLoad').onclick = async () => {
  const acc = document.getElementById('accInput').value;
  const month = parseInt(mSel.value);
  const year = parseInt(ySel.value);
  
  const snap = await db.ref(`account_data/${acc}/snapshots`).once('value');
  const data = snap.val() || {};
  
  // Mapping data ke Map agar mudah dicari berdasarkan tanggal YYYY-MM-DD
  const dailyMap = new Map();
  Object.keys(data).forEach(ts => {
    const d = new Date(parseInt(ts));
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    dailyMap.set(key, data[ts]);
  });

  renderCalendar(year, month, dailyMap);
};

function renderCalendar(year, month, dailyMap) {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  document.getElementById('calTitle').innerText = `${mNames[month]} ${year}`;
  document.getElementById('stats').classList.remove('hidden');

  // Cari hari pertama bulan ini
  const firstDay = new Date(year, month, 1);
  // Mundur ke hari Minggu terdekat (firstDay.getDay() 0=Minggu, 1=Senin...)
  const startOffset = firstDay.getDay(); 
  const startDate = new Date(firstDay);
  startDate.setDate(startDate.getDate() - startOffset);

  // Render 42 kotak (6 minggu) agar grid selalu rapi
  for (let i = 0; i < 42; i++) {
    const curr = new Date(startDate);
    curr.setDate(curr.getDate() + i);
    
    const isCurrentMonth = curr.getMonth() === month;
    const dateKey = `${curr.getFullYear()}-${curr.getMonth()}-${curr.getDate()}`;
    const dayData = dailyMap.get(dateKey);
    
    const div = document.createElement('div');
    const growth = dayData ? dayData.daily_growth_percent : null;
    
    let colorClass = "bg-empty";
    if (growth > 0) colorClass = "bg-win";
    else if (growth < 0) colorClass = "bg-loss";

    div.className = `calendar-day p-2 rounded-lg border border-slate-100 ${colorClass} ${isCurrentMonth ? '' : 'opacity-20'}`;
    div.innerHTML = `
      <div class="text-[10px] font-bold opacity-50">${curr.getDate()}</div>
      <div class="text-sm font-bold mt-1">${growth !== null ? growth.toFixed(2)+'%' : '-'}</div>
      <div class="text-[9px] opacity-70">${dayData ? '$'+dayData.daily_profit.toFixed(0) : ''}</div>
    `;
    grid.appendChild(div);
  }
}
</script>
</body>
</html>
